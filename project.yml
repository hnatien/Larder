name: Larder
options:
  bundleIdPrefix: com.larder
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.1"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LarderKit:
    path: .
targets:
  Larder:
    type: application
    platform: iOS
    sources:
      - path: App/Larder
        type: syncedFolder
        excludes:
          - Resources/Larder.storekit
      - path: App/Shared
    info:
      path: App/Larder/Info.plist
      properties:
        # Set per configuration below: Debug uses `wrangler dev` on this Mac, Release the deployed proxy.
        LarderProxyBaseURL: $(LARDER_PROXY_BASE_URL)
        # The paper canvas and the jar mark while the first frame loads.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        # larder://tonight opens the Tonight tab, from the widget.
        CFBundleURLTypes:
          - CFBundleURLName: com.larder.Larder
            CFBundleURLSchemes:
              - larder
    entitlements:
      path: App/Larder/Larder.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
        com.apple.security.application-groups:
          - group.com.larder.app
    dependencies:
      - package: LarderKit
        product: LarderCore
      - package: LarderKit
        product: LarderPersistence
      - package: LarderKit
        product: LarderAssistant
      - package: LarderKit
        product: LarderOnDeviceAI
      - package: LarderKit
        product: LarderDesign
      - package: LarderKit
        product: FeatureShelves
      - package: LarderKit
        product: FeatureLedger
      - package: LarderKit
        product: FeatureRecipes
      - package: LarderKit
        product: FeatureGrocery
      - package: LarderKit
        product: FeatureAccount
      - target: LarderWidgets
      - sdk: AppIntents.framework
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          Larder uses the camera to scan barcodes and receipts for your pantry and to read recipe pages. Photos are read on
          this device. If it can't read a recipe photo and AI help is on, that photo goes to Larder's assistant.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
      configs:
        # The Simulator reaches the Mac's `npx wrangler dev` at localhost.
        Debug:
          LARDER_PROXY_BASE_URL: http://localhost:8787
        # Placeholder until the proxy is deployed.
        Release:
          LARDER_PROXY_BASE_URL: https://proxy.larder.app
  LarderWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/LarderWidgets
      - path: App/Shared
    entitlements:
      path: App/LarderWidgets/LarderWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.larder.app
    info:
      path: App/LarderWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: LarderKit
        product: LarderCore
      - package: LarderKit
        product: LarderDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.larder.Larder.Widgets
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Larder
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  LarderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/LarderUITests
    dependencies:
      - target: Larder
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  Larder:
    build:
      targets:
        Larder: all
        LarderUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Larder/Resources/Larder.storekit
      environmentVariables:
        # Scripts/generate.sh fills this from Server/larder-proxy/.dev.vars; the generated project is git-ignored.
        LARDER_DEV_CLIENT_SECRET: ${LARDER_DEV_CLIENT_SECRET}
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LarderUITests
